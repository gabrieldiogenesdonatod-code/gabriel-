<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tocando agora · JARVIS</title>
<!-- Fork PT-BR 2.2: tela "Tocando agora" do JARVIS para o Spotify (e o que tocar no PC, como reserva). -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#04070d;--hud:#38d6ff;--hud2:rgba(56,214,255,.18);--hud3:rgba(56,214,255,.07);--texto:#d8f6ff;--mudo:#6d93a5;--verde:#1ed760;--verm:#ff5a5a}
html,body{background:#04070d;color:var(--texto);font-family:'Segoe UI',-apple-system,sans-serif;height:100%;overflow:hidden}
body{display:flex;flex-direction:column}
#fundo{position:fixed;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) brightness(.35) saturate(1.3);z-index:-1;transition:background-image .6s}
header{display:flex;align-items:center;gap:8px;padding:10px 14px}
.titulo{letter-spacing:2px;font-weight:700;color:var(--hud);font-size:12px;flex:1;text-shadow:0 0 10px rgba(56,214,255,.5)}
#servico{font-size:11px;color:var(--mudo)}
#topo{padding:4px 18px 0;text-align:center}
#capa{width:min(62vw,230px);aspect-ratio:1;margin:6px auto 12px;border-radius:14px;background:#0b1822 center/cover no-repeat;
 box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 0 1px var(--hud2);display:flex;align-items:center;justify-content:center;font-size:64px}
#nome{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#artista{font-size:14px;color:var(--mudo);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#barra{height:5px;background:rgba(255,255,255,.12);border-radius:9px;margin:14px 4px 4px;cursor:pointer;position:relative}
#barra i{position:absolute;inset:0 auto 0 0;background:var(--verde);border-radius:9px;width:0}
.tempos{display:flex;justify-content:space-between;font-size:11px;color:var(--mudo);padding:0 4px}
.controles{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0}
button{font:inherit;color:var(--texto);background:transparent;border:0;cursor:pointer;border-radius:50%}
.controles button{font-size:20px;width:42px;height:42px}
.controles .grande{width:58px;height:58px;font-size:24px;background:var(--texto);color:#04070d}
.controles .ligado{color:var(--verde)}
.vol{display:flex;align-items:center;gap:8px;padding:0 22px;font-size:13px;color:var(--mudo)}
input[type=range]{flex:1;accent-color:var(--verde)}
nav{display:flex;gap:6px;padding:12px 14px 6px}
nav button{border-radius:20px;padding:6px 12px;font-size:12px;border:1px solid var(--hud2);background:var(--hud3)}
nav button.ativo{background:rgba(56,214,255,.22);border-color:var(--hud)}
#lista{flex:1;overflow-y:auto;padding:0 10px 12px}
.item{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:10px;cursor:pointer}
.item:hover{background:var(--hud3)}
.item .mini{width:42px;height:42px;border-radius:6px;background:#0b1822 center/cover;flex:none}
.item b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item span{font-size:11px;color:var(--mudo)}
.item .txt{min-width:0;flex:1}
.item .mais{font-size:16px;color:var(--mudo);padding:6px}
#busca{display:none;padding:0 14px 6px}
#busca input{width:100%;font:inherit;color:var(--texto);background:#08131c;border:1px solid var(--hud2);border-radius:20px;padding:8px 12px}
.aviso{font-size:12px;color:var(--mudo);text-align:center;padding:16px;line-height:1.5}
#toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%) translateY(90px);background:#0c1c28;border:1px solid var(--hud);border-radius:12px;padding:8px 12px;font-size:13px;transition:transform .25s}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="fundo"></div>
<header><div class="titulo">J.A.R.V.I.S · TOCANDO AGORA</div><span id="servico"></span></header>
<section id="topo">
 <div id="capa">🎵</div>
 <div id="nome">Nada tocando</div>
 <div id="artista">Diga "Jarvis, toca…"</div>
 <div id="barra"><i></i></div>
 <div class="tempos"><span id="t1">0:00</span><span id="t2">0:00</span></div>
 <div class="controles">
  <button id="aleat" title="Aleatório">🔀</button><button id="ant" title="Anterior">⏮</button>
  <button id="play" class="grande" title="Tocar/pausar">▶</button>
  <button id="prox" title="Próxima">⏭</button><button id="rep" title="Repetir">🔁</button>
 </div>
 <div class="vol"><span>🔈</span><input type="range" id="vol" min="0" max="100" value="50"><button id="curtir" title="Curtir" style="font-size:18px">🤍</button></div>
</section>
<nav><button data-aba="playlists" class="ativo">Minhas playlists</button><button data-aba="buscar">🔎 Buscar</button></nav>
<div id="busca"><input id="q" placeholder="Música, artista ou playlist…"></div>
<div id="lista"></div>
<div id="toast"></div>
<script>
"use strict";
const T = new URLSearchParams(location.search).get("t") || "";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mmss = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.x); toast.x = setTimeout(() => t.classList.remove("show"), 3000); }
async function api(caminho, corpo) {
  const op = corpo === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) };
  const r = await fetch(caminho + (caminho.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(T), op);
  return r.json();
}
async function cmd(acao, extra = {}) {
  const r = await api("/api/musica/cmd", Object.assign({ acao }, extra)).catch(() => ({ ok: false, erro: "sem conexão com o JARVIS" }));
  if (!r.ok && r.erro) toast("⚠ " + r.erro);
  setTimeout(atualizar, 350); return r;
}
let est = {}, ultimaLeitura = 0, arrastandoVol = false;
async function atualizar() {
  try { est = await api("/api/musica"); ultimaLeitura = performance.now(); } catch (e) { return; }
  $("#servico").textContent = est.servico === "spotify" ? (est.aparelho ? "Spotify · " + est.aparelho : "Spotify") : "PC";
  $("#nome").textContent = est.vazio ? "Nada tocando" : (est.titulo || "—");
  $("#artista").textContent = est.vazio ? (est.conectado ? "Diga \"Jarvis, toca…\" ou escolha abaixo" : "Spotify não conectado: diga \"Jarvis, conecta o Spotify\"") : (est.artistas + (est.album ? " · " + est.album : ""));
  const capa = est.capa ? `url("${est.capa}")` : "";
  $("#capa").style.backgroundImage = capa; $("#capa").textContent = est.capa ? "" : "🎵"; $("#fundo").style.backgroundImage = capa;
  $("#play").textContent = est.tocando ? "⏸" : "▶";
  $("#aleat").classList.toggle("ligado", !!est.aleatorio); $("#rep").classList.toggle("ligado", est.repetir && est.repetir !== "off");
  $("#rep").textContent = est.repetir === "track" ? "🔂" : "🔁";
  if (!arrastandoVol && est.volume != null) $("#vol").value = est.volume;
  document.title = est.vazio ? "Tocando agora · JARVIS" : `${est.titulo} · ${est.artistas}`;
  desenharTempo();
}
function desenharTempo() {
  const dur = est.duracao_ms || 0;
  const prog = Math.min(dur, (est.progresso_ms || 0) + (est.tocando ? performance.now() - ultimaLeitura : 0));
  $("#barra i").style.width = dur ? (prog / dur * 100) + "%" : "0";
  $("#t1").textContent = mmss(prog); $("#t2").textContent = mmss(dur);
}
setInterval(desenharTempo, 500); setInterval(atualizar, 2500);
$("#play").onclick = () => cmd(est.tocando ? "pausar" : "play");
$("#prox").onclick = () => cmd("proxima"); $("#ant").onclick = () => cmd("anterior");
$("#aleat").onclick = () => cmd("aleatorio", { valor: !est.aleatorio });
$("#rep").onclick = () => cmd("repetir", { valor: { off: "context", context: "track", track: "off" }[est.repetir || "off"] });
$("#curtir").onclick = async () => { const r = await cmd("curtir"); if (r.ok) { $("#curtir").textContent = "💚"; toast("Curtida!"); } };
$("#barra").onclick = e => { if (!est.duracao_ms) return; const r = $("#barra").getBoundingClientRect(); cmd("posicao", { valor: Math.round((e.clientX - r.left) / r.width * est.duracao_ms) }); };
$("#vol").oninput = () => { arrastandoVol = true; };
$("#vol").onchange = () => { arrastandoVol = false; cmd("volume", { valor: +$("#vol").value }); };

// listas
let aba = "playlists";
function itemHTML(i) {
  return `<div class="item" data-uri="${esc(i.uri)}" data-nome="${esc(i.nome)}"><div class="mini" style="background-image:${i.capa ? `url('${esc(i.capa)}')` : "none"}"></div>
    <div class="txt"><b>${esc(i.nome)}</b><span>${esc(i.sub || (i.total != null ? i.total + " músicas" : ""))}</span></div>
    ${i.uri && i.uri.includes(":track:") ? '<button class="mais" title="Pôr na fila">＋</button>' : ""}</div>`;
}
function ligarItens() {
  document.querySelectorAll("#lista .item").forEach(el => {
    el.onclick = async e => {
      if (e.target.classList.contains("mais")) { const r = await cmd("fila", { uri: el.dataset.uri }); if (r.ok) toast("Na fila: " + el.dataset.nome); return; }
      const r = await cmd("tocar", { uri: el.dataset.uri, nome: el.dataset.nome }); if (r.ok) toast("Tocando: " + el.dataset.nome);
    };
  });
}
async function carregarPlaylists() {
  $("#lista").innerHTML = '<div class="aviso">Carregando…</div>';
  const r = await api("/api/musica/playlists").catch(() => ({ itens: [], erro: "sem conexão com o JARVIS" }));
  $("#lista").innerHTML = r.itens && r.itens.length ? r.itens.map(itemHTML).join("") : `<div class="aviso">${esc(r.erro || "Nenhuma playlist.")}</div>`;
  ligarItens();
}
let buscaTimer = null;
$("#q").oninput = () => {
  clearTimeout(buscaTimer);
  buscaTimer = setTimeout(async () => {
    const q = $("#q").value.trim(); if (!q) { $("#lista").innerHTML = ""; return; }
    const r = await api("/api/musica/buscar?q=" + encodeURIComponent(q)).catch(() => ({ itens: [] }));
    $("#lista").innerHTML = r.itens && r.itens.length ? r.itens.map(i => itemHTML({ ...i, sub: i.tipo + (i.sub && i.sub !== i.tipo ? " · " + i.sub : "") })).join("") : `<div class="aviso">${esc(r.erro || "Nada encontrado.")}</div>`;
    ligarItens();
  }, 350);
};
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  aba = b.dataset.aba; document.querySelectorAll("nav button").forEach(x => x.classList.toggle("ativo", x === b));
  $("#busca").style.display = aba === "buscar" ? "block" : "none";
  if (aba === "playlists") carregarPlaylists(); else { $("#lista").innerHTML = ""; $("#q").focus(); }
});
document.addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return; if (e.code === "Space") { e.preventDefault(); $("#play").click(); } if (e.key === "ArrowRight") $("#prox").click(); if (e.key === "ArrowLeft") $("#ant").click(); });
atualizar(); carregarPlaylists();
</script>
</body>
</html>
