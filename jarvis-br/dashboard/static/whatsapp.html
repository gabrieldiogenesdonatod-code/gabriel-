<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp do JARVIS</title>
<!-- Fork PT-BR 2.2: tela do QR code do WhatsApp — mostra o andamento (instalando, abrindo), o QR ao vivo e os erros. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#04070d;--hud:#38d6ff;--hud2:rgba(56,214,255,.18);--texto:#d8f6ff;--mudo:#5f8597;--verde:#3dffa0;--verm:#ff5a5a;--ouro:#ffb547}
html,body{background:radial-gradient(circle at 50% 0%,#0b1a26 0%,var(--bg) 70%) fixed;color:var(--texto);font-family:'Segoe UI',sans-serif;min-height:100%}
main{max-width:520px;margin:0 auto;padding:22px 18px;text-align:center}
h1{font-size:15px;letter-spacing:5px;color:var(--hud);margin-bottom:14px}
#etapa{font-size:17px;margin:10px 0 6px}
#detalhe{font-size:13px;color:var(--mudo);line-height:1.5;min-height:20px}
#qr{margin:18px auto;width:320px;height:320px;border-radius:16px;background:#fff;display:none;padding:10px}
#qr img{width:100%;height:100%;image-rendering:pixelated}
.giro{width:56px;height:56px;margin:24px auto;border-radius:50%;border:4px solid var(--hud2);border-top-color:var(--hud);animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
ol{text-align:left;font-size:14px;line-height:1.7;margin:10px 0 0 22px}
pre{text-align:left;font-size:11px;color:var(--ouro);background:#08131c;border:1px solid var(--hud2);border-radius:10px;padding:10px;margin-top:14px;white-space:pre-wrap;display:none}
button{font:inherit;color:var(--texto);background:rgba(56,214,255,.08);border:1px solid var(--hud2);border-radius:10px;padding:9px 14px;margin-top:14px;cursor:pointer}
.ok{color:var(--verde)}.ruim{color:var(--verm)}
</style>
</head>
<body>
<main>
 <h1>WHATSAPP DO J.A.R.V.I.S</h1>
 <div id="giro" class="giro"></div>
 <div id="etapa">Preparando…</div>
 <div id="detalhe"></div>
 <div id="qr"><img id="qrimg" alt="QR code"></div>
 <ol id="passos" style="display:none">
  <li>Abra o WhatsApp no celular do número que o JARVIS vai usar.</li>
  <li>Toque em ⋮ (ou Configurações) → <b>Aparelhos conectados</b> → <b>Conectar um aparelho</b>.</li>
  <li>Aponte a câmera para este QR code.</li>
 </ol>
 <pre id="log"></pre>
 <button id="tentar" style="display:none">Tentar de novo</button>
</main>
<script>
"use strict";
const t = new URLSearchParams(location.search).get("t") || "";
const $ = s => document.querySelector(s);
const TEXTOS = {
  instalando: ["Instalando a ponte do WhatsApp…", "Só na primeira vez. Pode levar alguns minutos; deixe esta janela aberta."],
  abrindo: ["Abrindo o WhatsApp Web escondido…", "Quase lá: o QR code aparece aqui em instantes."],
  iniciando: ["Abrindo o WhatsApp Web escondido…", "O QR code aparece aqui em instantes."],
  autenticado: ["Entrando…", "QR lido! Carregando as conversas."],
};
let falhas = 0;
async function atualizar() {
  let e;
  try { e = await (await fetch("/api/whatsapp?t=" + encodeURIComponent(t))).json(); falhas = 0; }
  catch (err) { if (++falhas > 3) { $("#etapa").textContent = "O JARVIS fechou?"; $("#giro").style.display = "none"; } return; }
  const pronto = e.estado === "pronto", qr = e.estado === "qr" && e.qr;
  const erro = e.etapa === "erro" || e.estado === "falha" || (e.estado === "desconectado" && e.erro);
  $("#giro").style.display = pronto || qr || erro ? "none" : "";
  $("#qr").style.display = qr ? "block" : "none"; $("#passos").style.display = qr ? "" : "none";
  if (qr) $("#qrimg").src = e.qr;
  $("#tentar").style.display = erro ? "" : "none";
  $("#log").style.display = erro && e.log ? "block" : "none"; $("#log").textContent = e.log || "";
  if (pronto) { $("#etapa").innerHTML = '<span class="ok">✅ Conectado!</span>'; $("#detalhe").textContent = "Número " + (e.numero || "") + ". Mande \"ajuda\" para o JARVIS. Pode fechar esta janela."; }
  else if (qr) { $("#etapa").textContent = "Leia o QR code com o celular"; $("#detalhe").textContent = "Ele muda sozinho a cada ~20 segundos; esta tela acompanha."; }
  else if (erro) {
    $("#etapa").innerHTML = '<span class="ruim">Não deu certo</span>';
    $("#detalhe").textContent = e.erro || (e.node ? "Veja o registro abaixo." : "Falta o Node.js: instale em nodejs.org (LTS), feche e abra o JARVIS.");
  } else if (e.estado === "desligado" && !e.etapa) { $("#etapa").textContent = "WhatsApp desligado"; $("#detalhe").textContent = "Clique em Tentar de novo."; $("#tentar").style.display = ""; $("#giro").style.display = "none"; }
  else { const [a, b] = TEXTOS[e.etapa === "ligada" ? e.estado : e.etapa] || TEXTOS.iniciando; $("#etapa").textContent = a; $("#detalhe").textContent = b; }
}
$("#tentar").onclick = async () => { await fetch("/api/whatsapp/ligar?t=" + encodeURIComponent(t), { method: "POST", body: "{}" }).catch(() => {}); atualizar(); };
atualizar(); setInterval(atualizar, 1500);
</script>
</body>
</html>
