<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>JARVIS · Holograma</title>
<!-- Fork PT-BR 1.9: holograma de pirâmide (Pepper's ghost). O rosto do JARVIS em 4 lados, espelhado,
     para uma pirâmide de acrílico/capa de CD em cima do celular. Fundo preto de propósito. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden;height:100%;touch-action:manipulation}
canvas{display:block;width:100vw;height:100vh}
#menu{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;transition:opacity .4s}
#menu button{font:13px 'Segoe UI',sans-serif;color:#7fdfff;background:#06121a;border:1px solid #1d4a5c;border-radius:10px;padding:8px 12px}
#menu.some{opacity:0;pointer-events:none}
#ajuda{position:fixed;top:12px;left:50%;transform:translateX(-50%);color:#3e7d94;font:12px 'Segoe UI',sans-serif;text-align:center;max-width:90vw}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ajuda">Ponha o celular deitado e a pirâmide (ponta para baixo) no centro, no escuro. Toque para esconder os botões.</div>
<div id="menu">
 <button id="tela">⛶ Tela cheia</button><button id="esp">⇋ Espelhar</button><button id="tam">◎ Tamanho</button><a href="/"><button>‹ Voltar</button></a>
</div>
<script>
"use strict";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let espelhar = true, escala = 1, energia = 0, fala = '', falaAte = 0;
try { espelhar = localStorage.getItem('holo_esp') !== '0'; escala = parseFloat(localStorage.getItem('holo_tam') || '1') || 1; } catch (e) {}
function ajustar() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener('resize', ajustar); ajustar();

// O "rosto" do JARVIS: núcleo do reator, anéis girando, olhos e boca que reagem quando ele fala.
function rosto(t, r) {
  const pulso = 1 + energia * 0.25 + Math.sin(t * 2) * 0.03;
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.55 * pulso);
  g.addColorStop(0, 'rgba(220,250,255,1)'); g.addColorStop(0.25, 'rgba(56,214,255,.9)'); g.addColorStop(1, 'rgba(56,214,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 0.55 * pulso, 0, 7); ctx.fill();
  ctx.lineCap = 'round';
  for (let k = 0; k < 3; k++) {
    const raio = r * (0.62 + k * 0.13), v = (k % 2 ? -1 : 1) * (0.6 + k * 0.25);
    ctx.strokeStyle = `rgba(56,214,255,${0.75 - k * 0.18})`; ctx.lineWidth = r * (0.03 - k * 0.006);
    for (let s = 0; s < 6 + k * 2; s++) {
      const a = t * v + s * (Math.PI * 2 / (6 + k * 2));
      ctx.beginPath(); ctx.arc(0, 0, raio, a, a + 0.5 + energia * 0.3); ctx.stroke();
    }
  }
  // olhos e boca (de frente para quem olha a pirâmide)
  ctx.fillStyle = '#e8fbff'; ctx.shadowColor = '#38d6ff'; ctx.shadowBlur = r * 0.12;
  const piscar = (t % 5) < 0.12 ? 0.15 : 1;
  for (const lado of [-1, 1]) { ctx.beginPath(); ctx.ellipse(lado * r * 0.18, -r * 0.1, r * 0.06, r * 0.06 * piscar, 0, 0, 7); ctx.fill(); }
  ctx.strokeStyle = '#e8fbff'; ctx.lineWidth = r * 0.025; ctx.beginPath();
  const abre = r * (0.02 + energia * 0.1 * (0.6 + 0.4 * Math.sin(t * 22)));
  ctx.moveTo(-r * 0.16, r * 0.16); ctx.quadraticCurveTo(0, r * 0.16 + abre * 2, r * 0.16, r * 0.16); ctx.stroke();
  ctx.shadowBlur = 0;
  if (fala && performance.now() < falaAte) {
    ctx.fillStyle = 'rgba(180,240,255,.9)'; ctx.font = `${Math.round(r * 0.11)}px Segoe UI, sans-serif`; ctx.textAlign = 'center';
    ctx.fillText(fala.length > 38 ? fala.slice(0, 36) + '…' : fala, 0, r * 1.18);
  }
}

function quadro(ms) {
  const t = ms / 1000, W = cv.width, H = cv.height, m = Math.min(W, H);
  energia *= 0.94;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const r = m * 0.12 * escala, d = m * 0.27 * escala;          // distância do centro (onde fica a ponta da pirâmide)
  // 4 vistas: baixo, esquerda, cima, direita — cada uma "olhando" para fora, como pede a pirâmide
  for (let k = 0; k < 4; k++) {
    ctx.setTransform(1, 0, 0, 1, W / 2, H / 2);
    ctx.rotate(k * Math.PI / 2);
    ctx.translate(0, d);
    ctx.rotate(Math.PI);                 // o topo do rosto aponta para a borda: a face da pirâmide reflete "de pé"
    if (espelhar) ctx.scale(-1, 1);      // o reflexo inverte esquerda/direita; espelhando aqui, o texto fica legível
    rosto(t, r);
  }
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);

// fala do JARVIS (se o celular estiver logado no painel): o rosto mexe a boca e mostra a frase
(function conectar() {
  const tok = sessionStorage.getItem('jarvis_token'); if (!tok) return;
  try {
    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?token=${encodeURIComponent(tok)}`);
    ws.onmessage = ev => { try { const m = JSON.parse(ev.data);
      if (m.type === 'log' && m.speaker === 'jarvis') { energia = 1; fala = m.text || ''; falaAte = performance.now() + 6000;
        const fim = performance.now() + Math.min(8000, 60 * (m.text || '').length);
        (function mexer() { if (performance.now() < fim) { energia = Math.max(energia, 0.7 + Math.random() * 0.3); setTimeout(mexer, 90); } })(); }
    } catch (e) {} };
    ws.onclose = () => setTimeout(conectar, 4000);
  } catch (e) {}
})();

const menu = document.getElementById('menu'), ajuda = document.getElementById('ajuda');
cv.onclick = () => { menu.classList.toggle('some'); ajuda.style.display = menu.classList.contains('some') ? 'none' : ''; energia = 1; };
document.getElementById('tela').onclick = async () => {
  try { await document.documentElement.requestFullscreen(); } catch (e) {}
  try { await navigator.wakeLock.request('screen'); } catch (e) {}
  menu.classList.add('some'); ajuda.style.display = 'none';
};
document.getElementById('esp').onclick = () => { espelhar = !espelhar; try { localStorage.setItem('holo_esp', espelhar ? '1' : '0'); } catch (e) {} };
document.getElementById('tam').onclick = () => { escala = escala >= 1.3 ? 0.7 : +(escala + 0.15).toFixed(2); try { localStorage.setItem('holo_tam', escala); } catch (e) {} };
</script>
</body>
</html>
