<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holograma na mão · JARVIS</title>
<!-- Fork PT-BR 2.5: holograma na palma da mão. Webcam espelhada + MediaPipe Hands (no navegador, nada sai do PC)
     + um cartão holográfico com o que você pediu ao JARVIS, preso em cima da sua palma.
     Mão aberta = aparece · mão fechada = some · pinça (polegar + indicador) = próximo cartão.
     ?simular=1 desenha uma mão de mentira (para testar sem câmera). -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--hud:#38d6ff;--texto:#d8f6ff;--mudo:#6d93a5}
html,body{height:100%;background:#02050a;color:var(--texto);font-family:'Segoe UI',-apple-system,sans-serif;overflow:hidden}
video,canvas{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover}
video{transform:scaleX(-1);filter:brightness(.78) saturate(1.05) contrast(1.05)}
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:12px 16px;
  background:linear-gradient(#02050acc,#02050a00);z-index:2}
.titulo{letter-spacing:4px;font-weight:700;color:var(--hud);font-size:13px;text-shadow:0 0 10px rgba(56,214,255,.6)}
#status{font-size:12px;color:var(--mudo);flex:1}
#aviso{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);font-size:14px;color:var(--texto);
  background:rgba(2,10,16,.72);border:1px solid rgba(56,214,255,.3);border-radius:14px;padding:10px 16px;
  text-align:center;max-width:min(92vw,560px);line-height:1.5;z-index:2;transition:opacity .4s}
#aviso.some{opacity:0}
</style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>
<canvas id="c"></canvas>
<header><span class="titulo">HOLOGRAMA</span><span id="status">ligando a câmera…</span></header>
<div id="aviso">Mostre a <b>palma da mão aberta</b> para a câmera ✋<br><small>Feche a mão para esconder · pinça (polegar + indicador) troca o cartão</small></div>
<script type="module">
const T = new URLSearchParams(location.search).get("t") || "";
const SIMULAR = new URLSearchParams(location.search).has("simular");
const VERSAO = "0.10.14";
const video = document.getElementById("v"), cv = document.getElementById("c"), ctx = cv.getContext("2d");
const statusEl = document.getElementById("status"), aviso = document.getElementById("aviso");
let W = 0, H = 0;
function ajustar(){ W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", ajustar); ajustar();

// ── conteúdo vindo do JARVIS ──────────────────────────────────────────────
let cartoes = [{tipo: "relogio", titulo: "J.A.R.V.I.S", texto: "Peça: “Jarvis, mostra o clima na minha mão”"}];
let versao = -1, indice = 0;
const imagens = {};
async function puxar(){
  try {
    const r = await fetch("/api/mao?t=" + encodeURIComponent(T));
    const d = await r.json();
    if (d.versao !== versao && Array.isArray(d.cartoes) && d.cartoes.length){
      versao = d.versao; cartoes = d.cartoes; indice = Math.min(indice, cartoes.length - 1);
      if (d.novo) { indice = cartoes.length - 1; surgir = 0; }
    }
  } catch (e) {}
}
if (T) { puxar(); setInterval(puxar, 1200); }
function imagem(src){
  if (!src) return null;
  if (!imagens[src]){ const im = new Image(); im.src = src; imagens[src] = im; }
  return imagens[src].complete && imagens[src].naturalWidth ? imagens[src] : null;
}

// ── mão ───────────────────────────────────────────────────────────────────
let maos = null, mao = null, ultimaMao = 0, aberta = false, surgir = 0, ultimaPinca = 0, pincando = false;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function ler(L){
  const pares = [[8, 6], [12, 10], [16, 14], [20, 18]];
  let estendidos = 0;
  for (const [ponta, junta] of pares) if (dist(L[ponta], L[0]) > dist(L[junta], L[0]) * 1.12) estendidos++;
  const palma = dist(L[5], L[17]);
  return {estendidos, palma, pinca: dist(L[4], L[8]) < palma * 0.32};
}
async function iniciarMaos(){
  const {FilesetResolver, HandLandmarker} = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VERSAO}/vision_bundle.mjs`);
  const vision = await FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VERSAO}/wasm`);
  const modelo = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
  try {
    maos = await HandLandmarker.createFromOptions(vision, {baseOptions: {modelAssetPath: modelo, delegate: "GPU"}, runningMode: "VIDEO", numHands: 1});
  } catch (e) {
    maos = await HandLandmarker.createFromOptions(vision, {baseOptions: {modelAssetPath: modelo, delegate: "CPU"}, runningMode: "VIDEO", numHands: 1});
  }
}
async function iniciar(){
  if (SIMULAR){ statusEl.textContent = "simulação (sem câmera)"; return; }
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({video: {width: {ideal: 1280}, height: {ideal: 720}}, audio: false});
  } catch (e) {
    statusEl.textContent = "sem câmera";
    aviso.innerHTML = "Não consegui abrir a câmera (" + (e.name || e) + ").<br><small>Ela pode estar em uso por outro programa — feche os gestos ou a câmera do JARVIS e reabra esta janela.</small>";
    return;
  }
  statusEl.textContent = "carregando o detector de mãos…";
  try { await iniciarMaos(); statusEl.textContent = "pronto"; }
  catch (e) { statusEl.textContent = "sem detector de mãos (precisa de internet na 1ª vez)"; }
}
iniciar();

function maoSimulada(t){
  // uma mão aberta que balança devagar (coordenadas da câmera, sem espelho)
  const cx = 0.5 + Math.sin(t * .6) * .12, cy = 0.68 + Math.sin(t * .9) * .03, s = 0.16, a = Math.sin(t * .7) * .18;
  const base = [[0,0],[-.35,-.15],[-.55,-.35],[-.7,-.55],[-.85,-.72],[-.3,-.6],[-.33,-.95],[-.35,-1.15],[-.36,-1.32],
    [-.08,-.65],[-.08,-1.03],[-.08,-1.25],[-.08,-1.45],[.14,-.62],[.16,-.97],[.17,-1.17],[.18,-1.34],[.33,-.55],[.38,-.82],[.41,-.98],[.43,-1.12]];
  const fechada = (t % 14) > 11.5;
  return base.map(([x, y], i) => {
    let yy = y; if (fechada && i > 5 && i % 4 !== 1) yy = y * 0.45;
    const rx = x * Math.cos(a) - yy * Math.sin(a), ry = x * Math.sin(a) + yy * Math.cos(a);
    return {x: cx + rx * s, y: cy + ry * s * 1.3};
  });
}

// ── desenho ───────────────────────────────────────────────────────────────
function px(p){ return {x: (1 - p.x) * W, y: p.y * H}; }        // espelhado, como o vídeo
function linhasDeTexto(texto, largura, fonte){
  ctx.font = fonte; const palavras = String(texto || "").split(/\s+/); const linhas = []; let atual = "";
  for (const p of palavras){ const teste = atual ? atual + " " + p : p;
    if (ctx.measureText(teste).width > largura && atual){ linhas.push(atual); atual = p; } else atual = teste; }
  if (atual) linhas.push(atual);
  return linhas.slice(0, 7);
}
function retangulo(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function cartao(c, larg, t){
  const pad = larg * .07, fonteT = `700 ${Math.round(larg * .062)}px Segoe UI, sans-serif`, fonteX = `${Math.round(larg * .052)}px Segoe UI, sans-serif`;
  let titulo = c.titulo || "", texto = c.texto || "";
  if (c.tipo === "relogio"){ const d = new Date(); titulo = titulo || "AGORA";
    texto = d.toLocaleTimeString("pt-BR") + " · " + d.toLocaleDateString("pt-BR", {weekday: "long", day: "numeric", month: "long"}); }
  const linhas = linhasDeTexto(texto, larg - pad * 2, fonteX);
  const im = imagem(c.imagem);
  const altImg = im ? Math.min(larg * .62, (larg - pad * 2) * im.naturalHeight / im.naturalWidth) : 0;
  const alt = pad * 2 + larg * .075 + (altImg ? altImg + pad * .6 : 0) + linhas.length * larg * .068 + (cartoes.length > 1 ? pad * .7 : 0);
  return {alt, desenhar(x, y){
    ctx.save();
    const g = ctx.createLinearGradient(x, y, x, y + alt);
    g.addColorStop(0, "rgba(56,214,255,.20)"); g.addColorStop(1, "rgba(56,214,255,.07)");
    retangulo(x, y, larg, alt, larg * .05); ctx.fillStyle = g; ctx.fill();
    ctx.shadowColor = "rgba(56,214,255,.9)"; ctx.shadowBlur = larg * .05; ctx.strokeStyle = "rgba(120,230,255,.85)"; ctx.lineWidth = Math.max(1.5, larg * .006); ctx.stroke();
    ctx.shadowBlur = 0;
    // cantos de HUD
    ctx.strokeStyle = "rgba(220,250,255,.9)"; ctx.lineWidth = Math.max(2, larg * .008); const k = larg * .07;
    for (const [cx, cy, sx, sy] of [[x, y, 1, 1], [x + larg, y, -1, 1], [x, y + alt, 1, -1], [x + larg, y + alt, -1, -1]]){
      ctx.beginPath(); ctx.moveTo(cx + sx * k, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy + sy * k); ctx.stroke(); }
    let yy = y + pad + larg * .06;
    ctx.fillStyle = "#e8fbff"; ctx.font = fonteT; ctx.textAlign = "left"; ctx.shadowColor = "#38d6ff"; ctx.shadowBlur = larg * .03;
    ctx.fillText(String(titulo).toUpperCase().slice(0, 34), x + pad, yy); ctx.shadowBlur = 0;
    yy += pad * .5;
    if (im){ ctx.globalAlpha = .92; ctx.drawImage(im, x + pad, yy, larg - pad * 2, altImg); ctx.globalAlpha = 1;
      ctx.strokeStyle = "rgba(56,214,255,.5)"; ctx.strokeRect(x + pad, yy, larg - pad * 2, altImg); yy += altImg + pad * .6; }
    ctx.font = fonteX; ctx.fillStyle = "rgba(216,246,255,.95)";
    for (const l of linhas){ yy += larg * .068; ctx.fillText(l, x + pad, yy); }
    // linhas de varredura e cintilação
    ctx.globalAlpha = .07 + .04 * Math.sin(t * 30); ctx.fillStyle = "#bff3ff";
    for (let s = y + ((t * 40) % 6); s < y + alt; s += 6) ctx.fillRect(x + 2, s, larg - 4, 1);
    ctx.globalAlpha = 1;
    if (cartoes.length > 1){ for (let i = 0; i < cartoes.length; i++){ ctx.beginPath(); ctx.fillStyle = i === indice ? "#e8fbff" : "rgba(120,230,255,.35)";
      ctx.arc(x + larg / 2 + (i - (cartoes.length - 1) / 2) * larg * .045, y + alt - pad * .45, larg * .011, 0, 7); ctx.fill(); } }
    ctx.restore();
  }};
}

function holograma(L, t, forca){
  const palmaPts = [0, 5, 9, 13, 17].map(i => px(L[i]));
  const centro = {x: palmaPts.reduce((s, p) => s + p.x, 0) / 5, y: palmaPts.reduce((s, p) => s + p.y, 0) / 5};
  const a = px(L[5]), b = px(L[17]);
  const palma = Math.hypot(a.x - b.x, a.y - b.y);
  const larg = Math.max(220 * devicePixelRatio, Math.min(560 * devicePixelRatio, palma * 3.3));
  let ang = Math.atan2(b.y - a.y, b.x - a.x); if (Math.abs(ang) > Math.PI / 2) ang += Math.PI;
  ang = Math.max(-.3, Math.min(.3, ang)) * .4;
  const c = cartao(cartoes[indice] || cartoes[0], larg, t);
  const altura = palma * 1.55 + c.alt;                    // o cartão flutua acima da ponta dos dedos
  const cabe = Math.max(.45, Math.min(1, (centro.y - H * .09) / altura));   // não deixa o cartão sair por cima da tela
  const esc = (.25 + .75 * forca) * cabe;
  ctx.save();
  ctx.translate(centro.x, centro.y); ctx.rotate(ang);
  ctx.globalAlpha = forca * (0.9 + 0.1 * Math.sin(t * 17));
  // anel do "projetor" na palma
  ctx.strokeStyle = "rgba(120,230,255,.8)"; ctx.lineWidth = Math.max(2, palma * .025);
  for (let k = 0; k < 3; k++){ const r = palma * (.18 + k * .1), v = (k % 2 ? -1 : 1) * 2;
    ctx.beginPath(); ctx.arc(0, 0, r, t * v, t * v + 4); ctx.stroke(); }
  // feixe de luz até o cartão
  ctx.globalCompositeOperation = "lighter";
  const topo = -altura * esc;
  const g = ctx.createLinearGradient(0, 0, 0, topo + c.alt * esc);
  g.addColorStop(0, "rgba(56,214,255,.45)"); g.addColorStop(1, "rgba(56,214,255,.04)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-palma * .12, 0); ctx.lineTo(palma * .12, 0);
  ctx.lineTo(larg * esc / 2, topo + c.alt * esc); ctx.lineTo(-larg * esc / 2, topo + c.alt * esc); ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation = "source-over";
  ctx.translate(0, topo); ctx.scale(esc, esc);
  c.desenhar(-larg / 2, 0);
  ctx.restore();
}

function esqueleto(L){
  const lig = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
  ctx.strokeStyle = "rgba(56,214,255,.35)"; ctx.lineWidth = 2 * devicePixelRatio;
  for (const [i, j] of lig){ const a = px(L[i]), b = px(L[j]); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  ctx.fillStyle = "rgba(220,250,255,.7)";
  for (const p of L){ const q = px(p); ctx.beginPath(); ctx.arc(q.x, q.y, 2.5 * devicePixelRatio, 0, 7); ctx.fill(); }
}

let anterior = performance.now();
function quadro(ms){
  const dt = Math.min(.05, (ms - anterior) / 1000); anterior = ms; const t = ms / 1000;
  ctx.clearRect(0, 0, W, H);
  if (SIMULAR){ const g = ctx.createRadialGradient(W * .5, H * .4, 0, W * .5, H * .5, Math.max(W, H) * .7);
    g.addColorStop(0, "#1b2a33"); g.addColorStop(1, "#05080c"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  let L = null;
  if (SIMULAR) L = maoSimulada(t);
  else if (maos && video.readyState >= 2){
    try { const r = maos.detectForVideo(video, ms); L = r.landmarks && r.landmarks[0] ? r.landmarks[0] : null; } catch (e) {}
  }
  if (L){ mao = L; ultimaMao = ms; }
  else if (ms - ultimaMao > 350) mao = null;
  if (mao){
    const g = ler(mao);
    aberta = g.estendidos >= 3 ? true : g.estendidos <= 1 ? false : aberta;
    if (g.pinca && !pincando && ms - ultimaPinca > 700 && cartoes.length > 1){ indice = (indice + 1) % cartoes.length; ultimaPinca = ms; surgir = .4; }
    pincando = g.pinca;
    esqueleto(mao);
  }
  const alvo = mao && aberta ? 1 : 0;
  surgir += (alvo - surgir) * Math.min(1, dt * (alvo ? 6 : 9));
  if (mao && surgir > .02) holograma(mao, t, surgir);
  aviso.classList.toggle("some", !!(mao && aberta));
  if (!SIMULAR && maos) statusEl.textContent = mao ? (aberta ? "mão aberta" : "mão fechada") : "procurando a mão…";
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);
</script>
</body>
</html>
