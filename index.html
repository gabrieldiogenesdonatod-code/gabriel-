<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S V6</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at center, #08283a 0%, #03070d 42%, #010306 100%);
    color: #e8faff;
    font-family: Consolas, Arial, sans-serif;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: 
        linear-gradient(rgba(0,200,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,255,.025) 1px, transparent 1px);
    background-size: 35px 35px;
}

.container {
    width: min(1200px, 94%);
    margin: auto;
    padding: 22px 0;
}

.header {
    text-align: center;
    margin-bottom: 18px;
}

.title {
    color: #00c8ff;
    font-size: clamp(34px, 7vw, 64px);
    font-weight: bold;
    letter-spacing: 5px;
    text-shadow: 0 0 18px #00c8ff;
}

.subtitle {
    color: #78909c;
    font-size: 11px;
    letter-spacing: 3px;
}

.status {
    margin-top: 10px;
    color: #00ff9d;
    font-weight: bold;
    font-size: 11px;
}

.layout {
    display: grid;
    grid-template-columns: 1fr 285px;
    gap: 16px;
}

.panel {
    background: rgba(7,19,31,.88);
    border: 1px solid #0c3b50;
    border-radius: 16px;
    box-shadow: 0 0 30px rgba(0,200,255,.07);
}

.chat-container {
    background: #02060b;
    border: 1px solid #0c3b50;
    border-radius: 12px;
    min-height: 570px;
    max-height: 62vh;
    overflow-y: auto;
    padding: 18px;
}

.message {
    margin: 0 0 17px;
    line-height: 1.55;
    white-space: pre-wrap;
    font-size: 11px;
}

.message .who {
    color: #00c8ff;
    font-weight: bold;
    margin-bottom: 4px;
    font-size: 10px;
}

.message.user .who {
    color: #8cecff;
}

.side {
    padding: 18px;
    text-align: center;
}

.core {
    width: 230px;
    height: 230px;
    margin: 8px auto;
    border-radius: 50%;
    display: grid;
    place-items: center;
    position: relative;
}

.core::before,
.core::after {
    content: "";
    position: absolute;
    inset: 12px;
    border: 2px solid #075b78;
    border-radius: 50%;
    box-shadow: 0 0 18px rgba(0,200,255,.5);
}

.core::after {
    inset: 55px;
    border-color: #00c8ff;
    border-width: 3px;
}

.core-center {
    width: 38px;
    height: 38px;
    border: 2px solid #8cecff;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #8cecff;
    font-size: 22px;
    font-weight: bold;
    background: #06283a;
    box-shadow: 0 0 25px #00c8ff;
    z-index: 2;
}

.info {
    color: #78909c;
    font-size: 9px;
    margin: 4px;
}

button {
    width: 100%;
    border: none;
    background: #06283a;
    color: #8cecff;
    padding: 12px;
    margin-top: 8px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-family: Arial, sans-serif;
    font-size: 11px;
    transition: background 0.2s;
}

button:hover {
    background: #0b4962;
    color: #fff;
}

button.active {
    border: 1px solid #00ff9d;
    color: #00ff9d;
    box-shadow: 0 0 15px rgba(0,255,157,.25);
}

.input-area {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: 1px solid #0c3b50;
    border-radius: 6px;
    outline: none;
    background: #02060b;
    color: #e8faff;
    font-family: Consolas, Arial, sans-serif;
    font-size: 12px;
}

.input-area button {
    width: 120px;
    margin: 0;
    background: #07364a;
}

@media (max-width: 900px) {
    .layout {
        grid-template-columns: 1fr;
    }
    .side {
        order: -1;
    }
}
</style>
</head>

<body>
<div class="container">

    <div class="header">
        <div class="title">J.A.R.V.I.S</div>
        <div class="subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
        <div class="status" id="status">● PRONTA</div>
    </div>

    <div class="layout">

        <!-- Painel do Chat -->
        <div class="panel" style="padding: 15px; display: flex; flex-direction: column;">
            <div class="chat-container" id="chat">
                <div class="message">
                    <div class="who">J.A.R.V.I.S</div>
                    Sistema online, senhor. J.A.R.V.I.S V6 está pronta.
                </div>
                <div class="message">
                    <div class="who">SISTEMA</div>
                    Idioma: Português do Brasil<br>
                    Reconhecimento: Web Speech API<br>
                    Voz: SpeechSynthesis
                </div>
            </div>

            <div class="input-area">
                <input id="entrada" placeholder="Digite seu comando, senhor..." autocomplete="off">
                <button onclick="enviar()">ENVIAR</button>
            </div>
        </div>

        <!-- Painel Direito / Núcleo -->
        <div class="panel side">
            <div style="font-family: Arial; font-weight: bold; font-size: 13px; color: #00c8ff; margin-bottom: 8px;">NÚCLEO J.A.R.V.I.S</div>
            
            <div class="core">
                <div class="core-center">J</div>
            </div>

            <div class="info" id="statusMic">MICROFONE: PRONTO</div>
            <div class="info" id="statusIa" style="color: #00ff9d; font-weight: bold;">IA: PRONTA</div>

            <button id="micButton" onclick="ouvir()" style="background: #06283a; margin-top: 20px;">
                🎤 OUVIR
            </button>

            <button id="botaoVoz" onclick="alternarVoz()" style="background: #08243a;">
                🔊 VOZ: ON
            </button>

            <button onclick="testarVoz()" style="background: #08243a;">
                🔊 TESTAR VOZ
            </button>
        </div>

    </div>
</div>

<script>
let vozAtiva = true;
let ouvindo = false;
let memoria = JSON.parse(localStorage.getItem("jarvis_memoria") || "{}");

const entrada = document.getElementById("entrada");
const chat = document.getElementById("chat");
const statusEl = document.getElementById("status");
const statusMic = document.getElementById("statusMic");
const statusIa = document.getElementById("statusIa");
const micButton = document.getElementById("micButton");
const botaoVoz = document.getElementById("botaoVoz");

function adicionarChat(remetente, texto) {
    const div = document.createElement("div");
    div.className = "message" + (remetente === "VOCÊ" ? " user" : "");

    const who = document.createElement("div");
    who.className = "who";
    who.textContent = remetente;

    const content = document.createElement("div");
    content.textContent = texto;

    div.appendChild(who);
    div.appendChild(content);

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function falar(texto) {
    if (!vozAtiva || !("speechSynthesis" in window)) {
        statusEl.textContent = "● PRONTA";
        statusEl.style.color = "#00ff9d";
        return;
    }

    window.speechSynthesis.cancel();

    const fala = new SpeechSynthesisUtterance(texto);
    fala.lang = "pt-BR";
    fala.rate = 1.0;
    fala.pitch = 0.9;
    fala.volume = 1.0;

    const vozes = window.speechSynthesis.getVoices();
    const brasileira = vozes.find(v => v.lang && v.lang.toLowerCase().includes("pt"));
    if (brasileira) fala.voice = brasileira;

    statusEl.textContent = "● FALANDO";
    statusEl.style.color = "#00c8ff";

    fala.onend = function() {
        statusEl.textContent = "● PRONTA";
        statusEl.style.color = "#00ff9d";
    };

    window.speechSynthesis.speak(fala);
}

function testarVoz() {
    falar("Olá, senhor. Teste de voz concluído. J.A.R.V.I.S está falando em português do Brasil.");
}

function alternarVoz() {
    vozAtiva = !vozAtiva;
    if (vozAtiva) {
        botaoVoz.textContent = "🔊 VOZ: ON";
        falar("Voz ativada, senhor.");
    } else {
        botaoVoz.textContent = "🔇 VOZ: OFF";
        window.speechSynthesis.cancel();
        statusEl.textContent = "● VOZ DESATIVADA";
        statusEl.style.color = "#ffd166";
    }
}

function processarComandosSistema(pergunta) {
    const c = pergunta.toLowerCase().trim();

    if (c === "sair" || c === "desligar jarvis") {
        falar("Até logo, senhor. Encerrando.");
        setTimeout(() => window.close(), 2000);
        return "Até logo, senhor.";
    }

    if (c.includes("que horas") || c === "hora" || c === "data") {
        const agora = new Date();
        return `Senhor, hoje é ${agora.toLocaleDateString("pt-BR")} e são ${agora.toLocaleTimeString("pt-BR")}.`;
    }

    if (c.startsWith("pesquisar ")) {
        const termo = pergunta.substring(10).trim();
        window.open(`https://www.google.com/search?q=${encodeURIComponent(termo)}`, "_blank");
        return `Senhor, iniciei a pesquisa por ${termo}.`;
    }

    if (c.startsWith("lembre que ")) {
        const info = pergunta.substring(11).trim();
        const chave = "info_" + (Object.keys(memoria).length + 1);
        memoria[chave] = info;
        localStorage.setItem("jarvis_memoria", JSON.stringify(memoria));
        return "Entendido, senhor. Guardei essa informação na memória.";
    }

    if (c === "apagar memória" || c === "limpar memória") {
        memoria = {};
        localStorage.removeItem("jarvis_memoria");
        return "Minha memória foi limpa, senhor.";
    }

    // Atalhos de sites úteis
    const sites = {
        "google": "https://www.google.com",
        "youtube": "https://www.youtube.com",
        "chatgpt": "https://chatgpt.com",
        "github": "https://github.com",
        "gmail": "https://mail.google.com"
    };

    if (c.startsWith("abrir ")) {
        const siteNome = c.replace("abrir ", "").trim();
        if (sites[siteNome]) {
            window.open(sites[siteNome], "_blank");
            return `Senhor, abrindo ${siteNome}.`;
        }
    }

    return null;
}

async function processarIA(pergunta) {
    statusEl.textContent = "● PENSANDO";
    statusEl.style.color = "#ffd166";
    statusIa.textContent = "IA: PROCESSANDO";
    statusIa.style.color = "#ffd166";

    // Tenta usar a API local do Ollama (caso esteja rodando no PC)
    try {
        const resposta = await fetch("http://localhost:11434/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama3.2:3b",
                messages: [
                    { role: "system", content: "Você é J.A.R.V.I.S., um assistente pessoal inteligente. Responda em Português do Brasil chamando o usuário de 'senhor'." },
                    { role: "user", content: pergunta }
                ],
                stream: false
            })
        });

        if (resposta.ok) {
            const dados = await resposta.json();
            statusIa.textContent = "IA: PRONTA";
            statusIa.style.color = "#00ff9d";
            return dados.message.content.trim();
        }
    } catch (e) {
        // Se o Ollama não estiver aberto, cai para respostas padrão inteligentes
        statusIa.textContent = "IA: MODO LOCAL";
        statusIa.style.color = "#ffd166";
    }

    return `Senhor, recebi seu comando: "${pergunta}". Para respostas avançadas com IA, certifique-se de que o Ollama está rodando localmente na porta 11434.`;
}

async function enviar() {
    const texto = entrada.value.trim();
    if (!texto) return;

    adicionarChat("VOCÊ", texto);
    entrada.value = "";

    // Verifica comandos rápidos locais primeiro
    let resposta = processarComandosSistema(texto);

    if (!resposta) {
        resposta = await processarIA(texto);
    }

    adicionarChat("J.A.R.V.I.S", resposta);
    falar(resposta);
}

entrada.addEventListener("keydown", function(event) {
    if (event.key === "Enter") enviar();
});

// ---------------- MICROFONE (WEB SPEECH API) ----------------
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function ouvir() {
    if (!SpeechRecognition) {
        alert("Seu navegador não suporta reconhecimento de voz. Use o Google Chrome ou Microsoft Edge.");
        return;
    }

    if (ouvindo) return;

    const reconhecimento = new SpeechRecognition();
    reconhecimento.lang = "pt-BR";
    reconhecimento.continuous = false;
    reconhecimento.interimResults = false;

    ouvindo = true;
    micButton.classList.add("active");
    micButton.textContent = "🎙️ OUVINDO...";
    statusMic.textContent = "MICROFONE: FALE AGORA";
    statusMic.style.color = "#00c8ff";
    statusEl.textContent = "● OUVINDO";
    statusEl.style.color = "#00c8ff";

    reconhecimento.start();

    reconhecimento.onresult = function(event) {
        const textoTranscrito = event.results[0][0].transcript;
        entrada.value = textoTranscrito;
        enviar();
    };

    reconhecimento.onerror = function(event) {
        statusMic.textContent = "MICROFONE: ERRO";
        statusMic.style.color = "#ff496c";
    };

    reconhecimento.onend = function() {
        ouvindo = false;
        micButton.classList.remove("active");
        micButton.textContent = "🎤 OUVIR";
        statusMic.textContent = "MICROFONE: PRONTO";
        statusMic.style.color = "#78909c";
        statusEl.textContent = "● PRONTA";
        statusEl.style.color = "#00ff9d";
    };
}

// Inicialização de boas-vindas
window.onload = function() {
    entrada.focus();
    setTimeout(() => {
        falar("Sistema online, senhor. J.A.R.V.I.S V6 está pronta para receber seus comandos.");
    }, 1000);
};
</script>
</body>
</html>
